<!DOCTYPE html>

    <style>
        body {
            font-family: 'Share Tech Mono', monospace;
            background-color: #000000;
            color: #00ff66;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }
        
        /* Canvas background styling for Matrix rain */
        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            opacity: 0.25;
        }

        /* Glowing text effects */

            text-shadow: 0 0 8px rgba(0, 255, 102, 0.7), 0 0 20px rgba(0, 255, 102, 0.4);
        }

        .neon-glow-cyan {
            text-shadow: 0 0 8px rgba(0, 243, 255, 0.7), 0 0 20px rgba(0, 243, 255, 0.4);
        }

        /* Cyberpunk / Matrix button styling */
        .matrix-btn {
            background: rgba(0, 20, 10, 0.85);
            border: 2px solid #00ff66;
            color: #00ff66;
            padding: 12px 24px;
            font-size: 1rem;
            font-family: 'Share Tech Mono', monospace;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.2);
            position: relative;
            overflow: hidden;
        }

        .matrix-btn:hover {
            background: #00ff66;
            color: #000000;
            box-shadow: 0 0 25px #00ff66, 0 0 50px rgba(0, 255, 102, 0.5);
            transform: translateY(-2px);
        }

        .matrix-btn:active {
            transform: translateY(1px);
        }

        /* Container backdrop for legibility */
        .glass-panel {
            background: rgba(0, 10, 5, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(0, 255, 102, 0.3);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.9);
        }
    </style>
</head>

    <script>
        // Toggle view functions
        function donations() {
            document.getElementById("crypto").classList.remove("hidden");
            document.getElementById("menu").classList.add("hidden");
            document.getElementById("msgs").innerText = "Cryptocurrency Donations - Thank You!";
        }

        function load_menu() {
            document.getElementById("menu").classList.remove("hidden");
            document.getElementById("crypto").classList.add("hidden");
            document.getElementById("msgs").innerText = "PS4 Exploit Host by Matrix";
        }

        // Matrix Digital Rain Animation Script
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const characters = '0123456789ABCDEFHIJKLMNOPQRSTUVWXYZﾊﾐﾋｰｳｼﾅﾓﾆｻﾜﾂｵﾘｱﾎﾃﾏｹﾒｴｶｷﾑﾕﾗｾﾈｽﾀﾇﾍ';
        const fontSize = 16;
        let columns = Math.floor(canvas.width / fontSize);
        let drops = [];

        for (let i = 0; i < columns; i++) {
            drops[i] = 1;
        }

        function drawMatrixRain() {
            // Translucent black background to create fading trailing effect
            ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#00ff66';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = characters.charAt(Math.floor(Math.random() * characters.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        // Run animation loop smoothly
        setInterval(drawMatrixRain, 35);
    </script>
</body>
</html>
